openapi: 3.2.0
info:
  title: TheRundown Sports V2 Reference API
  version: 2.0.0
  description: Real-time and historical sports betting data, odds, lines, and statistics across major North American and international sports leagues.
  contact:
    name: TheRundown API Support
    url: https://therundown.io
    email: support@therundown.io
  termsOfService: https://therundown.io/terms
servers:
- url: https://therundown.io
  description: Production
security:
- ApiKeyQuery: []
- ApiKeyHeader: []
tags:
- name: V2 Reference
  description: Reference data — affiliates, sportsbooks, season types (V2)
paths:
  /api/v2/affiliates:
    get:
      operationId: v2GetAffiliates
      tags:
      - V2 Reference
      summary: List all sportsbooks/affiliates
      description: Returns all enabled sportsbooks with IDs, names, and URLs. No authentication required.
      security: []
      parameters:
      - name: include
        in: query
        schema:
          type: string
          enum:
          - regions
        description: Set to `regions` to include geographic region data
      responses:
        '200':
          description: List of affiliates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliatesResponse'
              example:
                affiliates:
                - affiliate_id: 2
                  affiliate_name: Bovada
                  affiliate_url: https://bovada.lv
                - affiliate_id: 3
                  affiliate_name: Pinnacle
                  affiliate_url: https://pinnacle.com
                - affiliate_id: 4
                  affiliate_name: Sportsbetting
                  affiliate_url: https://sportsbetting.ag
                - affiliate_id: 6
                  affiliate_name: BetOnline
                  affiliate_url: https://betonline.ag
                - affiliate_id: 11
                  affiliate_name: LowVig
                  affiliate_url: https://lowvig.ag
                - affiliate_id: 19
                  affiliate_name: DraftKings
                  affiliate_url: https://sportsbook.draftkings.com
                - affiliate_id: 22
                  affiliate_name: BetMGM
                  affiliate_url: https://sports.betmgm.com
                - affiliate_id: 23
                  affiliate_name: FanDuel
                  affiliate_url: https://sportsbook.fanduel.com
                - affiliate_id: 24
                  affiliate_name: PointsBet
                  affiliate_url: https://pointsbet.com
                - affiliate_id: 25
                  affiliate_name: Caesars
                  affiliate_url: https://caesars.com/sportsbook-and-casino
                - affiliate_id: 27
                  affiliate_name: BetRivers
                  affiliate_url: https://betrivers.com
  /api/v2/sportsbooks:
    get:
      operationId: v2GetSportsbooks
      tags:
      - V2 Reference
      summary: List all sportsbooks (alias for /affiliates)
      security: []
      parameters:
      - name: include
        in: query
        schema:
          type: string
          enum:
          - regions
      responses:
        '200':
          description: List of sportsbooks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliatesResponse'
              example:
                affiliates:
                - affiliate_id: 3
                  affiliate_name: Pinnacle
                  affiliate_url: https://www.pinnacle.com
                - affiliate_id: 19
                  affiliate_name: DraftKings
                  affiliate_url: https://sportsbook.draftkings.com
                - affiliate_id: 22
                  affiliate_name: BetMGM
                  affiliate_url: https://sports.betmgm.com
                - affiliate_id: 23
                  affiliate_name: FanDuel
                  affiliate_url: https://sportsbook.fanduel.com
  /api/v2/season_types:
    get:
      operationId: v2GetSeasonTypes
      tags:
      - V2 Reference
      summary: List season types per sport
      responses:
        '200':
          description: Season types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonTypesResponse'
              example:
                season_types:
                - sport_id: 1
                  sport_name: NCAA Football
                  season_type_id: 2
                  season_type_name: Regular Season
                - sport_id: 1
                  sport_name: NCAA Football
                  season_type_id: 3
                  season_type_name: Postseason
                - sport_id: 2
                  sport_name: NFL
                  season_type_id: 1
                  season_type_name: Preseason
                - sport_id: 2
                  sport_name: NFL
                  season_type_id: 2
                  season_type_name: Regular Season
                - sport_id: 2
                  sport_name: NFL
                  season_type_id: 3
                  season_type_name: Postseason
                - sport_id: 4
                  sport_name: NBA
                  season_type_id: 1
                  season_type_name: Preseason
                - sport_id: 4
                  sport_name: NBA
                  season_type_id: 2
                  season_type_name: Regular Season
                - sport_id: 4
                  sport_name: NBA
                  season_type_id: 3
                  season_type_name: Postseason
components:
  schemas:
    Affiliate:
      type: object
      properties:
        affiliate_id:
          type: integer
          example: 19
        affiliate_name:
          type: string
          example: Draftkings
        affiliate_url:
          type: string
          example: https://draftkings.com
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
    SeasonTypeSport:
      type: object
      properties:
        sport_id:
          type: integer
        sport_name:
          type: string
        season_type_id:
          type: integer
        season_type_name:
          type: string
    SeasonTypesResponse:
      type: object
      properties:
        season_types:
          type: array
          items:
            $ref: '#/components/schemas/SeasonTypeSport'
    AffiliatesResponse:
      type: object
      properties:
        affiliates:
          type: array
          items:
            $ref: '#/components/schemas/Affiliate'
    Region:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: API key as query parameter
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Therundown-Key
      description: API key as request header
