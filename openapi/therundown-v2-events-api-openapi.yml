                    period_id: 0
                    name: totals
                    participants:
                    - id: 1001
                      type: TYPE_RESULT
                      name: Over
                      lines:
                      - value: '224.5'
                        prices:
                          '19':
                            price: -110
                            is_main_line: true
                            updated_at: '2026-01-14T22:30:00Z'
                    - id: 1002
                      type: TYPE_RESULT
                      name: Under
                      lines:
                      - value: '224.5'
                        prices:
                          '19':
                            price: -110
                            is_main_line: true
                            updated_at: '2026-01-14T22:30:00Z'
  /api/v2/sports/{sportID}/openers/{date}:
    get:
      operationId: v2GetOpenersBySportAndDate
      tags:
      - V2 Events
      summary: Get opening lines for a sport and date
      description: Returns events with the earliest recorded market prices (opening lines).
      parameters:
      - $ref: '#/components/parameters/SportIDPath'
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/OffsetQuery'
      - $ref: '#/components/parameters/MarketIDsQuery'
      - $ref: '#/components/parameters/AffiliateIDsQuery'
      - $ref: '#/components/parameters/MainLineQuery'
      - name: hide_closed
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        description: Hide closed lines
      responses:
        '200':
          description: Events with opening market prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsV2Response'
              example:
                meta: null
                events:
                - event_id: 09bfa53f8484a63e584398545c035932
                  sport_id: 4
                  event_date: '2026-02-12T00:00:00Z'
                  teams:
                  - team_id: 11
                    name: Atlanta
                    mascot: Hawks
                    abbreviation: ATL
                    is_away: true
                    is_home: false
                  - team_id: 12
                    name: Charlotte
                    mascot: Hornets
                    abbreviation: CHA
                    is_away: false
                    is_home: true
                  markets:
                  - market_id: 1
                    name: moneyline
                    participants:
                    - name: Atlanta Hawks
                      type: TYPE_TEAM
                      lines:
                      - value: '0'
                        prices:
                          '19':
                            price: -105
                            is_main_line: true
                            updated_at: '2026-02-11T22:00:00Z'
