- name: v2GetFuturesForSport
  description: "Get futures for a sport Returns futures/outright **competition events** (e.g. tournament\
    \ winner) for a sport, with future-class markets in the standard V2 market → participants → lines\
    \ → prices shape and per-market settlement state. Competition events are excluded from the dated game\
    \ endpoints and served only here. **Early access — requires an Ultra plan or higher.**\n\nA competition\
    \ is an **interval**, not an instant: `event_date` is when it starts and `settle_by` is when it must\
    \ have graded. Futures events carry no `teams` array and no score — the human-readable identity is\
    \ `schedule.event_name`.\n\n**Date filtering uses interval overlap.** An event is returned when its\
    \ `[event_date, settle_by]` span intersects the requested window — `settle_by >= from` and `event_date\
    \ <= to`. So the default `from=now` means \"in flight right now\" and matches a season future that\
    \ started months ago.\n\n**Paging is keyset-based** (no skip parameter). When more results exist the\
    \ response carries `meta.next_cursor`; pass it back verbatim as `cursor`. Ordering is soonest-to-resolve\
    \ first: `settle_by`, then `event_date`, then `event_id`. `meta.count` is the number of events on\
    \ the page, `meta.has_more` says whether another page exists, and `meta.total` is the number of events\
    \ matching your filters across all pages, so a single call tells you the size of the listing.\n\n\
    **Default visibility:** settled markets are removed per market, an event is hidden once every requested\
    \ future-class market on it has settled, and terminal (final/canceled/abandoned) events are excluded.\
    \ `include_settled=true` lifts all of those **and** the default `from=now`, so settled history is\
    \ reachable.\n\n**Delta bootstrap:** On known zero-delay access, `meta.delta_last_id` can seed `GET\
    \ /api/v2/markets/delta` only when this snapshot explicitly reports `X-Data-Delay-Seconds: 0`; it\
    \ is a positive whole-integer cursor. With a positive, absent, or invalid delay header, keep using\
    \ scoped snapshots and do not substitute `0`. Futures market IDs are **not** in the delta feed's default\
    \ set — pass them explicitly (e.g. `market_ids=1141`) when polling. See the [Futures guide](/guides/futures)\
    \ for the full integration recipe.\n Read-only Product data or price calculation. Use returned canonical\
    \ IDs. Access, delay and metered usage follow your connected account; never infer coverage from an\
    \ empty result. One bounded request, no background polling or automatic retry. Affiliate 27 is excluded.\
    \ No wagers, account changes or guarantee of returns."
- name: v2GetFuturesEventByID
  description: "Get one futures competition, with progress and leaders Returns **one** futures/outright\
    \ competition event — the same envelope and event object shape as `GET /api/v2/sports/{sportID}/futures`\
    \ (`meta.delta_last_id`, `events` with a single event carrying `event_id`, `sport_id`, `event_date`,\
    \ `settle_by`, `event_status`, `settlement`, `schedule`, `markets`) — plus up to three optional detail-only\
    \ keys not served on the listing. **Early access — requires an Ultra plan or higher.**\n\n**`progress`**\
    \ — the competition's live non-odds state (a golf leaderboard, a team-sport standings table), refreshed\
    \ on its own cycle independent of the odds board. `entries[].participant_id` is the same participant\
    \ ID space `markets[].participants[].id` uses, so a progress row joins directly to a price. Omitted\
    \ entirely (never `null`) when no progress document exists yet for the competition — \"priced, no\
    \ odds-board progress\" is the normal state for a fresh team-championship board, not a degraded response.\
    \ See [Competition Stats (Progress)](/guides/futures#competition-stats-progress) for the full field-by-field\
    \ breakdown of both kinds live today.\n\n**`leaders`** / **`player_leaders`** — optional curated season-stats\
    \ leaderboards, team-grain and player-grain respectively, for a hand-verified set of sports. Both\
    \ reuse the same `{stat, stat_id, season_year, entries[]}` shape and are omitted entirely (never an\
    \ empty array) when the sport is not curated or no stat rows exist yet — see [Competition Stats (Progress)](/guides/futures#competition-stats-progress)\
    \ for the curated sport list and the two distinct entry ID spaces.\n\n**Settled competitions are always\
    \ served here.** Unlike the listing (which hides settled markets and terminal events unless `include_settled=true`),\
    \ this is a deep link to a specific competition you already hold the ID for, and it keeps working\
    \ after settlement, with the graded results visible in `settlement`. There is no `include_settled`\
    \ parameter on this endpoint.\n Read-only Product data or price calculation. Use returned canonical\
    \ IDs. Access, delay and metered usage follow your connected account; never infer coverage from an\
    \ empty result. One bounded request, no background polling or automatic retry. Affiliate 27 is excluded.\
    \ No wagers, account changes or guarantee of returns."
