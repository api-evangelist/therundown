- name: capture_v1_stream
  description: Read actual frames from the V1 WebSocket for selected events and books. Use only for legacy
    line contracts; prefer V2 market tools. Requires eligible WebSocket access with all periods, live/player-prop
    access and no delay; restricted custom plans must use REST. One bounded socket closes after at most
    five seconds of observation, 50 messages or 256 KiB; no ongoing background delivery.
- name: capture_market_stream
  description: Read actual V2 market-price WebSocket frames for explicit event/sport, market and affiliate
    filters. Requires eligible WebSocket access with all periods, live/player-prop access and no delay;
    restricted custom plans must use REST. Opens one socket for at most five seconds of observation, 50
    messages or 256 KiB, then closes. Empty capture is not proof of no changes or no coverage.
- name: capture_live_stream
  description: Read actual multiplexed WebSocket markets, scores, plays, stats, live game state, futures
    or hedge frames. Supports scoped subscriptions and supported snapshot, resync, usage and unsubscribe
    controls; only plays supports durable resume. Stats needs a REST baseline. Requires each channel entitlement;
    priced channels also need all periods, live/player-prop access and no delay. Restricted custom plans
    can use REST. At most three subscriptions, five seconds of observation, 50 messages and 256 KiB; the
    socket then closes. No continuous feed or automatic reconnect; report incomplete snapshot/replay and
    gaps.
- name: capture_hedge_stream
  description: Read actual frames from the dedicated V2 hedge WebSocket for selected events and books.
    Requires HedgeAccess or an eligible pass; this dedicated route has its own gate. Returns server-provided
    calculations only; places no wagers. Capture closes after at most five seconds of observation, 50
    messages or 256 KiB. No guaranteed opportunities or continuous coverage.
