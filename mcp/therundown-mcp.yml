- name: v2GetMarketsDelta
  description: "Get market price changes since a given ID Returns market line price changes (new, updated,\
    \ closed) since the specified `last_id`. Use for efficient polling.\n\n**Bootstrap flow:** On known\
    \ zero-delay access, call `GET /api/v2/sports/{sportID}/events/{date}` with the snapshot scope you\
    \ need. Use its positive whole-integer `meta.delta_last_id` only when that response explicitly reports\
    \ `X-Data-Delay-Seconds: 0`, then pass it as `last_id`. If the header is positive, absent, or invalid,\
    \ keep using scoped snapshots; do not substitute `0`.\n\n**Staleness guard:** Cursors older than 30\
    \ minutes are rejected with HTTP 400. After a cursor error, take at most one fresh scoped snapshot\
    \ and resume only when it meets the same zero-delay and valid-cursor conditions. Do not loop bootstrap\
    \ requests.\n\n**Core live markets:** Event snapshots expand `market_ids=1,2,3` to include in-play\
    \ IDs. This delta endpoint filters IDs literally, so poll `1,2,3,41,42,43` to receive full-game core\
    \ updates before and during play. Returned rows retain their actual market IDs.\n Read-only Product\
    \ data or price calculation. Use returned canonical IDs. Access, delay and metered usage follow your\
    \ connected account; never infer coverage from an empty result. One bounded request, no background\
    \ polling or automatic retry. Affiliate 27 is excluded. No wagers, account changes or guarantee of\
    \ returns."
